<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
:root{
  --bg:#07090b;--panel:#121417;--gold:#f3c95f;--gold2:#ffe7a0;
  --muted:#92959e;--text:#f5f5f6;--line:rgba(243,201,95,.30)
}
html{background:var(--bg)}
body{
  min-height:100vh;padding-bottom:88px;color:var(--text);
  background:
    radial-gradient(circle at 12% 3%,rgba(243,201,95,.14),transparent 25%),
    radial-gradient(circle at 92% 36%,rgba(243,201,95,.065),transparent 28%),
    linear-gradient(145deg,#07090b 0%,#121417 52%,#07090b 100%);
  -webkit-font-smoothing:antialiased
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);
  background-size:27px 27px
}
header{
  position:relative;z-index:1;text-align:center;padding:23px 18px 19px;
  background:linear-gradient(180deg,rgba(15,17,19,.96),rgba(15,17,19,.72));
  border-bottom:1px solid rgba(243,201,95,.22)
}
header h2{font-size:24px;color:var(--gold2);font-weight:800;letter-spacing:.1px}
.container{position:relative;z-index:1;max-width:760px;margin:auto;padding:18px 15px}
.card{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(243,201,95,.045),transparent 34%),
    linear-gradient(145deg,rgba(27,29,29,.98),rgba(11,13,16,.99));
  border:1px solid var(--line);border-radius:25px;padding:21px;
  margin-bottom:16px;box-shadow:0 18px 55px rgba(0,0,0,.38)
}
.card:after{
  content:"";position:absolute;width:180px;height:180px;right:-105px;top:-95px;
  border:1px solid rgba(243,201,95,.14);border-radius:50%;pointer-events:none
}
.card h3{font-size:20px;color:var(--text);margin-bottom:15px}
.history-item{
  position:relative;background:linear-gradient(145deg,rgba(243,201,95,.09),rgba(243,201,95,.025));
  border:1px solid rgba(243,201,95,.19);border-radius:16px;padding:16px;margin-top:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.20)
}
.history-item .title{color:var(--gold2);font-weight:750;font-size:14px}
.history-item .meta{color:#92959e;font-size:12px;margin-top:6px}
.history-item .amount{color:#f4f4f5;font-size:16px;font-weight:800;margin-top:8px}
.empty{color:#777b84;text-align:center;padding:25px 10px;font-size:13px}
.bottom{
  position:fixed;z-index:20;bottom:0;left:0;width:100%;height:78px;
  background:rgba(7,9,11,.97);backdrop-filter:blur(16px);
  border-top:1px solid rgba(243,201,95,.18);
  display:flex;justify-content:space-around;padding:7px 4px
}
.bottom a{
  flex:1;text-decoration:none;color:#777b84;text-align:center;font-size:10px;padding-top:1px
}
.bottom span{
  display:block;font-size:19px;line-height:24px;margin-bottom:2px;
  filter:grayscale(.15);transform:scale(.76)
}
.bottom a:nth-child(1){color:var(--gold2)}
@media(max-width:420px){
  .container{padding:14px 12px}.card{padding:18px;border-radius:22px}
  header h2{font-size:22px}.bottom span{font-size:18px;transform:scale(.74)}
}
</style>

<link rel="stylesheet" href="premium-brand.css">
</head>
