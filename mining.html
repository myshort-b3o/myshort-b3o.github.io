<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyShort Mining</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 215, 100, .18), transparent 35%),
        linear-gradient(180deg, #17120a 0%, #090909 55%, #050505 100%);
      color: #fff;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding-bottom: 40px;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px 18px;

      background: rgba(10, 10, 10, .88);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(255, 215, 100, .12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;

      background: linear-gradient(135deg, #ffe28a, #b8860b);
      box-shadow: 0 0 20px rgba(255, 200, 60, .25);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: #f7d675;
    }

    .brand-sub {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .status-pill {
      padding: 8px 12px;
      border-radius: 30px;

      font-size: 11px;
      font-weight: 700;

      background: rgba(255,255,255,.06);
      color: #aaa;

      border: 1px solid rgba(255,255,255,.08);
    }

    .status-pill.active {
      color: #e8ffb0;
      border-color: rgba(180,255,100,.35);
      background: rgba(130,190,40,.10);
    }

    .status-pill.stopped {
      color: #ffb0a8;
      border-color: rgba(255,100,80,.25);
      background: rgba(255,80,60,.08);
    }

    /* MAIN */

    .content {
      padding: 20px 16px;
    }

    .hero {
      text-align: center;
      padding: 24px 10px 18px;
    }

    .hero h1 {
      font-size: 29px;
      font-weight: 900;
      color: #f6d477;

      text-shadow:
        0 0 25px rgba(255,210,80,.18);
    }

    .hero p {
      margin-top: 8px;
      color: #999;
      font-size: 13px;
    }

    /* MINING CORE */

    .mining-core {
      position: relative;

      width: 230px;
      height: 230px;

      margin: 15px auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(246, 212, 119, .22);
    }

    .ring.one {
      width: 230px;
      height: 230px;
      animation: spin 14s linear infinite;
    }

    .ring.two {
      width: 195px;
      height: 195px;
      border-style: dashed;
      animation: spinReverse 10s linear infinite;
    }

    .ring.three {
      width: 160px;
      height: 160px;
      border-color: rgba(255,255,255,.08);
    }

    .core {
      position: relative;

      width: 125px;
      height: 125px;

      border-radius: 50%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 35% 30%, #ffeaa5, #c49325 45%, #513b0e 100%);

      box-shadow:
        0 0 25px rgba(255,210,70,.35),
        inset 0 0 25px rgba(255,255,255,.15);
    }

    .core-icon {
      font-size: 37px;
      margin-bottom: 3px;
    }

    .core-text {
      font-size: 11px;
      font-weight: 800;
      color: #2d2208;
      letter-spacing: 1px;
    }

    .core.active {
      animation: miningPulse 2.2s ease-in-out infinite;
    }

    .core.stopped {
      filter: grayscale(.6);
      opacity: .75;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes miningPulse {
      0%,100% {
        transform: scale(1);
        box-shadow:
          0 0 25px rgba(255,210,70,.35),
          inset 0 0 25px rgba(255,255,255,.15);
      }

      50% {
        transform: scale(1.045);
        box-shadow:
          0 0 50px rgba(255,210,70,.55),
          inset 0 0 30px rgba(255,255,255,.18);
      }
    }

    /* BALANCE */

    .balance-card {
      position: relative;
      overflow: hidden;

      padding: 22px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      border: 1px solid rgba(246,212,119,.17);

      box-shadow:
        0 15px 45px rgba(0,0,0,.35);
    }

    .balance-card::before {
      content: "";

      position: absolute;
      width: 150px;
      height: 150px;

      top: -80px;
      right: -60px;

      border-radius: 50%;

      background: rgba(246,212,119,.08);
      filter: blur(5px);
    }

    .balance-label {
      color: #999;
      font-size: 12px;
    }

    .balance-row {
      display: flex;
      align-items: end;
      justify-content: space-between;

      gap: 15px;

      margin-top: 7px;
    }

    .balance {
      font-size: 28px;
      font-weight: 900;

      color: #f6d477;

      word-break: break-all;
    }

    .asset {
      font-size: 13px;
      font-weight: 800;
      color: #aaa;
      padding-bottom: 4px;
    }

    .idr-balance {
      margin-top: 14px;
      padding-top: 14px;

      border-top: 1px solid rgba(255,255,255,.07);

      display: flex;
      justify-content: space-between;

      font-size: 13px;
    }

    .idr-balance span:first-child {
      color: #888;
    }

    .idr-balance span:last-child {
      color: #eee;
      font-weight: 700;
    }

    /* MINING INFO */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 12px;
    }

    .info-card {
      padding: 16px;

      border-radius: 17px;

      background: rgba(255,255,255,.045);

      border: 1px solid rgba(255,255,255,.07);
    }

    .info-title {
      color: #888;
      font-size: 11px;
    }

    .info-value {
      margin-top: 7px;

      font-size: 15px;
      font-weight: 800;

      color: #eee;

      word-break: break-word;
    }

    .info-value.gold {
      color: #f6d477;
    }

    /* BUTTON */

    .activate-btn {
      width: 100%;

      margin-top: 16px;

      padding: 17px;

      border: 0;
      border-radius: 17px;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      color: #231b08;

      background:
        linear-gradient(
          135deg,
          #fff0ad,
          #e1b84e,
          #a8790e
        );

      box-shadow:
        0 10px 30px rgba(205,160,45,.22);
    }

    .activate-btn:active {
      transform: scale(.985);
    }

    .activate-btn:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .activate-btn.active {
      background: rgba(255,255,255,.06);
      color: #aaa;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: none;
    }

    /* SWAP */

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 900;
      color: #eee;
      margin-bottom: 11px;
    }

    .panel {
      padding: 18px;

      border-radius: 20px;

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.07);
    }

    .input-label {
      display: block;

      margin-bottom: 7px;

      color: #999;

      font-size: 11px;
    }

    .input {
      width: 100%;

      padding: 14px;

      border-radius: 13px;

      border: 1px solid rgba(255,255,255,.09);

      outline: none;

      background: rgba(0,0,0,.35);

      color: #fff;

      font-size: 15px;
    }

    .input:focus {
      border-color: rgba(246,212,119,.5);
    }

    .swap-preview {
      display: flex;
      justify-content: space-between;

      margin-top: 12px;

      padding: 12px;

      border-radius: 12px;

      background: rgba(246,212,119,.05);

      color: #aaa;

      font-size: 12px;
    }

    .swap-preview strong {
      color: #f6d477;
    }

    .swap-btn {
      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border: 1px solid rgba(246,212,119,.25);

      border-radius: 13px;

      background: rgba(246,212,119,.08);

      color: #f6d477;

      font-weight: 800;

      cursor: pointer;
    }

    .swap-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* HISTORY */

    .history-item {
      padding: 15px;

      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .history-type {
      font-size: 13px;
      font-weight: 800;
      color: #eee;
    }

    .history-status {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f6d477;
    }

    .history-amount {
      margin-top: 5px;

      font-size: 13px;

      color: #bbb;
    }

    .history-date {
      margin-top: 5px;

      font-size: 10px;

      color: #666;
    }

    .empty {
      padding: 20px;

      text-align: center;

      color: #666;

      font-size: 12px;
    }

    /* TOAST */

    #toast {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translate(-50%, 20px);

      z-index: 100;

      width: calc(100% - 30px);
      max-width: 450px;

      padding: 13px 16px;

      border-radius: 14px;

      background: rgba(25,25,25,.96);

      border: 1px solid rgba(246,212,119,.2);

      color: #eee;

      font-size: 13px;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sync {
      margin-top: 9px;

      text-align: center;

      color: #666;

      font-size: 10px;
    }

    @media (max-width: 360px) {
      .balance {
        font-size: 23px;
      }

      .mining-core {
        transform: scale(.88);
        margin-top: 0;
        margin-bottom: 5px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <img
        class="brand-logo"
        src="logo.png"
        alt="MyShort"
        onerror="this.style.display='none'"
      >

      <div>
        <div class="brand-title">MYSHORT</div>
        <div class="brand-sub">XMR Mining Center</div>
      </div>

    </div>

    <div id="statusPill" class="status-pill">
      MEMUAT...
    </div>

  </header>


  <main class="content">

    <!-- HERO -->

    <section class="hero">

      <h1>MINING</h1>

      <p>
        Server-backed XMR mining
      </p>

    </section>


    <!-- MINING CORE -->

    <div class="mining-core">

      <div class="ring one"></div>
      <div class="ring two"></div>
      <div class="ring three"></div>

      <div id="miningCore" class="core stopped">

        <div class="core-icon">⛏</div>

        <div id="coreText" class="core-text">
          READY
        </div>

      </div>

    </div>


    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-label">
        XMR TERSEDIA
      </div>

      <div class="balance-row">

        <div id="xmrBalance" class="balance">
          0.000000000000
        </div>

        <div class="asset">
          XMR
        </div>

      </div>


      <div class="idr-balance">

        <span>
          Saldo Rupiah Utama
        </span>

        <span id="idrBalance">
          Rp 0
        </span>

      </div>

    </section>


    <!-- INFO -->

    <div class="grid">

      <div class="info-card">

        <div class="info-title">
          STATUS MINING
        </div>

        <div
          id="miningStatus"
          class="info-value"
        >
          -
        </div>

      </div>


      <div class="info-card">

        <div class="info-title">
          RATE
        </div>

        <div
          id="miningRate"
          class="info-value gold"
        >
          -
        </div>

      </div>


      <div class="info-card">

        <div class="info-title">
          HASIL SESI
        </div>

        <div
          id="sessionMined"
          class="info-value"
        >
          0 XMR
        </div>

      </div>


      <div class="info-card">

        <div class="info-title">
          AKTIF SEJAK
        </div>

        <div
          id="startedAt"
          class="info-value"
        >
          -
        </div>

      </div>

    </div>


    <!-- ACTIVATE -->

    <button
      id="activateBtn"
      class="activate-btn"
      type="button"
      onclick="activateMining()"
    >
      AKTIFKAN MINING
    </button>


    <div id="syncText" class="sync">
      Menunggu sinkronisasi server...
    </div>


    <!-- SWAP -->

    <section class="section">

      <div class="section-title">
        Tukar XMR ke Rupiah
      </div>

      <div class="panel">

        <label class="input-label">
          Jumlah XMR
        </label>

        <input
          id="swapAmount"
          class="input"
          type="number"
          min="0"
          step="0.000000000001"
          placeholder="Masukkan jumlah XMR"
          oninput="calculateSwap()"
        >


        <div class="swap-preview">

          <span>
            Estimasi Rupiah
          </span>

          <strong id="swapIDR">
            Rp 0
          </strong>

        </div>


        <button
          id="swapBtn"
          class="swap-btn"
          type="button"
          onclick="requestSwap()"
        >
          AJUKAN PENUKARAN
        </button>

      </div>

    </section>


    <!-- HISTORY -->

    <section class="section">

      <div class="section-title">
        Riwayat Mining
      </div>

      <div id="historyPanel" class="panel">

        <div class="empty">
          Memuat riwayat...
        </div>

      </div>

    </section>

  </main>

</div>


<div id="toast"></div>


<script>

  /*
   * ==========================================
   * MYSHORT MINING V2
   * SERVER AUTHORITATIVE
   * ==========================================
   */

  let currentUser = null;

  let miningSession = null;

  let miningConfig = null;

  let miningWallet = null;

  let heartbeatTimer = null;

  let statusTimer = null;

  let isBusy = false;


  /*
   * ------------------------------------------
   * HELPER
   * ------------------------------------------
   */

  function toast(message) {

    const el = document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    setTimeout(() => {

      el.classList.remove("show");

    }, 2800);

  }


  function formatXMR(value) {

    const n = Number(value || 0);

    if (!Number.isFinite(n)) {
      return "0.000000000000";
    }

    return n.toFixed(12);

  }


  function formatDate(value) {

    if (!value) return "-";

    try {

      return new Date(value).toLocaleString(
        "id-ID",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    } catch {

      return "-";

    }

  }


  function normalizeRPC(data) {

    if (Array.isArray(data)) {

      return data[0] || null;

    }

    return data || null;

  }


  /*
   * ------------------------------------------
   * LOAD USER
   * ------------------------------------------
   */

  async function loadUser() {

    const session = await window.requireAuth();

    if (!session) return false;

    currentUser = session.user;

    return true;

  }


  /*
   * ------------------------------------------
   * LOAD CONFIG
   * ------------------------------------------
   */

  async function loadConfig() {

    const { data, error } = await window.sb

      .from("mining_config")

      .select("*")

      .eq("asset_code", "XMR")

      .maybeSingle();


    if (error) {

      console.error(error);

      throw error;

    }


    miningConfig = data;

  }


  /*
   * ------------------------------------------
   * LOAD MINING WALLET
   * ------------------------------------------
   */

  async function loadMiningWallet() {

    const { data, error } = await window.sb

      .rpc("get_my_mining_wallet");


    if (error) {

      console.error(
        "get_my_mining_wallet:",
        error
      );

      throw error;

    }


    miningWallet = normalizeRPC(data);

    updateWalletUI();

  }


  /*
   * ------------------------------------------
   * LOAD IDR WALLET
   * ------------------------------------------
   */

  async function loadIDRWallet() {

    const { data, error } = await window.sb

      .from("wallets")

      .select("balance")

      .eq("user_id", currentUser.id)

      .maybeSingle();


    if (error) {

      console.error(error);

      return;

    }


    document.getElementById(
      "idrBalance"
    ).textContent =
      window.moneyIDR(
        data?.balance || 0
      );

  }


  /*
   * ------------------------------------------
   * SERVER MINING STATUS
   * ------------------------------------------
   */

  async function loadMiningStatus() {

    const { data, error } = await window.sb

      .rpc("ms_mining_status");


    if (error) {

      console.error(
        "ms_mining_status:",
        error
      );

      throw error;

    }


    miningSession = normalizeRPC(data);

    updateMiningUI();

    /*
     * Status call dapat menghasilkan reward
     * server-side. Jadi wallet harus dibaca
     * kembali setelah status.
     */

    await loadMiningWallet();

  }


  /*
   * ------------------------------------------
   * UI WALLET
   * ------------------------------------------
   */

  function updateWalletUI() {

    const amount =
      miningWallet?.available_amount || 0;

    document.getElementById(
      "xmrBalance"
    ).textContent =
      formatXMR(amount);

  }


  /*
   * ------------------------------------------
   * UI MINING
   * ------------------------------------------
   */

  function updateMiningUI() {

    const active =
      miningSession?.status === "active";


    const pill =
      document.getElementById("statusPill");

    const status =
      document.getElementById("miningStatus");

    const core =
      document.getElementById("miningCore");

    const coreText =
      document.getElementById("coreText");

    const button =
      document.getElementById("activateBtn");


    if (active) {

      pill.textContent =
        "● MINING AKTIF";

      pill.className =
        "status-pill active";


      status.textContent =
        "AKTIF";


      core.className =
        "core active";


      coreText.textContent =
        "MINING";


      button.textContent =
        "MINING SEDANG AKTIF";


      button.classList.add("active");

      button.disabled = true;

    } else {

      pill.textContent =
        "● STOPPED";

      pill.className =
        "status-pill stopped";


      status.textContent =
        "BERHENTI";


      core.className =
        "core stopped";


      coreText.textContent =
        "READY";


      button.textContent =
        "AKTIFKAN MINING";


      button.classList.remove("active");

      button.disabled = false;

    }


    document.getElementById(
      "sessionMined"
    ).textContent =
      formatXMR(
        miningSession?.total_session_mined || 0
      ) + " XMR";


    document.getElementById(
      "startedAt"
    ).textContent =
      formatDate(
        miningSession?.started_at
      );


    if (miningSession?.rate_xmr_per_second) {

      const rate =
        Number(
          miningSession.rate_xmr_per_second
        );

      const perMinute =
        rate * 60;

      document.getElementById(
        "miningRate"
      ).textContent =
        formatXMR(perMinute) +
        " XMR/menit";

    } else if (miningConfig?.rate_xmr_per_second) {

      const rate =
        Number(
          miningConfig.rate_xmr_per_second
        );

      document.getElementById(
        "miningRate"
      ).textContent =
        formatXMR(rate * 60) +
        " XMR/menit";

    } else {

      document.getElementById(
        "miningRate"
      ).textContent =
        "-";

    }

  }


  /*
   * ------------------------------------------
   * AKTIFKAN MINING
   * ------------------------------------------
   */

  async function activateMining() {

    if (isBusy) return;

    isBusy = true;

    const button =
      document.getElementById(
        "activateBtn"
      );


    button.disabled = true;

    button.textContent =
      "MENGAKTIFKAN...";


    try {

      const { data, error } =
        await window.sb.rpc(
          "ms_mining_activate"
        );


      if (error) {

        console.error(error);

        throw error;

      }


      miningSession =
        normalizeRPC(data);


      toast(
        "Mining berhasil diaktifkan."
      );


      updateMiningUI();

      await loadMiningWallet();

      await loadIDRWallet();

      startHeartbeat();

    } catch (error) {

      console.error(
        "Aktivasi mining:",
        error
      );


      toast(
        error?.message ||
        "Gagal mengaktifkan mining."
      );


      button.disabled = false;

      button.textContent =
        "AKTIFKAN MINING";

    } finally {

      isBusy = false;

    }

  }


  /*
   * ------------------------------------------
   * HEARTBEAT
   *
   * Server yang menghitung reward.
   * Browser TIDAK menambahkan XMR.
   * ------------------------------------------
   */

  async function sendHeartbeat() {

    if (
      !currentUser ||
      miningSession?.status !== "active"
    ) {
      return;
    }


    try {

      const { data, error } =
        await window.sb.rpc(
          "ms_mining_heartbeat"
        );


      if (error) {

        console.warn(
          "Heartbeat error:",
          error
        );

        return;

      }


      miningSession =
        normalizeRPC(data);


      updateMiningUI();


      /*
       * Ambil saldo XMR dari server
       */

      await loadMiningWallet();


      document.getElementById(
        "syncText"
      ).textContent =
        "Server tersinkron: " +
        new Date().toLocaleTimeString(
          "id-ID"
        );


    } catch (error) {

      console.warn(
        "Heartbeat gagal:",
        error
      );

    }

  }


  /*
   * ------------------------------------------
   * START HEARTBEAT
   * ------------------------------------------
   */

  function startHeartbeat() {

    stopHeartbeat();


    /*
     * Langsung sync.
     */

    sendHeartbeat();


    /*
     * Setiap 60 detik.
     */

    heartbeatTimer =
      setInterval(
        sendHeartbeat,
        60000
      );

  }


  /*
   * ------------------------------------------
   * STOP HEARTBEAT
   * ------------------------------------------
   */

  function stopHeartbeat() {

    if (heartbeatTimer) {

      clearInterval(
        heartbeatTimer
      );

      heartbeatTimer = null;

    }

  }


  /*
   * ------------------------------------------
   * PERIODIC STATUS CHECK
   * ------------------------------------------
   */

  function startStatusCheck() {

    if (statusTimer) {

      clearInterval(
        statusTimer
      );

    }


    statusTimer =
      setInterval(
        async () => {

          if (
            document.visibilityState ===
            "visible"
          ) {

            try {

              await loadMiningStatus();

            } catch (e) {

              console.warn(e);

            }

          }

        },

        5 * 60 * 1000

      );

  }


  /*
   * ------------------------------------------
   * PAGE VISIBILITY
   * ------------------------------------------
   *
   * Ketika user kembali membuka halaman,
   * langsung sinkron dengan server.
   */

  document.addEventListener(
    "visibilitychange",
    async () => {

      if (
        document.visibilityState ===
        "visible"
      ) {

        try {

          await loadMiningStatus();

          await loadIDRWallet();


          if (
            miningSession?.status ===
            "active"
          ) {

            startHeartbeat();

          } else {

            stopHeartbeat();

          }

        } catch (error) {

          console.warn(error);

        }

      }

    }
  );


  /*
   * ------------------------------------------
   * SWAP CALCULATION
   * ------------------------------------------
   */

  function calculateSwap() {

    const amount =
      Number(
        document.getElementById(
          "swapAmount"
        ).value || 0
      );


    const rate =
      Number(
        document.getElementById(
          "swapRate"
        )?.value || 0
      );


    /*
     * Rate swap sebenarnya akan ditentukan
     * admin saat approve.
     *
     * Di halaman ini kita tampilkan
     * estimasi menggunakan konfigurasi
     * jika tersedia.
     */

    let estimate = 0;


    if (
      miningConfig &&
      Number(miningConfig.xmr_idr_rate || 0)
    ) {

      estimate =
        amount *
        Number(
          miningConfig.xmr_idr_rate
        );

    } else {

      estimate = 0;

    }


    document.getElementById(
      "swapIDR"
    ).textContent =
      window.moneyIDR(
        estimate
      );

  }


  /*
   * ------------------------------------------
   * REQUEST SWAP
   * ------------------------------------------
   */

  async function requestSwap() {

    if (isBusy) return;


    const input =
      document.getElementById(
        "swapAmount"
      );


    const amount =
      Number(
        input.value || 0
      );


    if (
      !Number.isFinite(amount) ||
      amount <= 0
    ) {

      toast(
        "Masukkan jumlah XMR terlebih dahulu."
      );

      return;

    }


    const available =
      Number(
        miningWallet?.available_amount || 0
      );


    if (amount > available) {

      toast(
        "Saldo XMR tidak mencukupi."
      );

      return;

    }


    isBusy = true;


    const button =
      document.getElementById(
        "swapBtn"
      );


    button.disabled = true;

    button.textContent =
      "MEMPROSES...";


    try {

      const { data, error } =
        await window.sb.rpc(
          "request_mining_swap",
          {
            p_coin_amount: amount
          }
        );


      if (error) {

        console.error(error);

        throw error;

      }


      toast(
        "Permintaan penukaran berhasil dibuat."
      );


      input.value = "";

      calculateSwap();


      await loadMiningWallet();

      await loadIDRWallet();

      await loadHistory();


    } catch (error) {

      console.error(
        "request_mining_swap:",
        error
      );


      toast(
        error?.message ||
        "Gagal mengajukan penukaran."
      );

    } finally {

      isBusy = false;

      button.disabled = false;

      button.textContent =
        "AJUKAN PENUKARAN";

    }

  }


  /*
   * ------------------------------------------
   * HISTORY
   * ------------------------------------------
   */

  async function loadHistory() {

    const panel =
      document.getElementById(
        "historyPanel"
      );


    const [payoutResult, swapResult] =
      await Promise.all([

        window.sb

          .from("mining_payouts")

          .select(
            "id,asset_code,amount,external_ref,status,note,created_at"
          )

          .eq(
            "user_id",
            currentUser.id
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(20),


        window.sb

          .from("mining_swap_requests")

          .select(
            "id,asset_code,coin_amount,idr_rate,idr_amount,status,external_ref,admin_note,created_at,processed_at"
          )

          .eq(
            "user_id",
            currentUser.id
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(20)

      ]);


    if (payoutResult.error) {

      console.warn(
        payoutResult.error
      );

    }


    if (swapResult.error) {

      console.warn(
        swapResult.error
      );

    }


    const payouts =
      (payoutResult.data || [])
        .map(item => ({

          type: "Payout XMR",

          amount:
            "+" +
            formatXMR(item.amount) +
            " XMR",

          status:
            item.status,

          date:
            item.created_at

        }));


    const swaps =
      (swapResult.data || [])
        .map(item => ({

          type: "Swap XMR → IDR",

          amount:
            "-" +
            formatXMR(item.coin_amount) +
            " XMR",

          status:
            item.status,

          date:
            item.created_at

        }));


    const history =
      [...payouts, ...swaps]
        .sort(
          (a, b) =>
            new Date(b.date) -
            new Date(a.date)
        )
        .slice(0, 30);


    if (!history.length) {

      panel.innerHTML =
        `<div class="empty">
          Belum ada riwayat mining.
        </div>`;

      return;

    }


    panel.innerHTML =
      history.map(item => `

        <div class="history-item">

          <div class="history-top">

            <div class="history-type">
              ${escapeHTML(item.type)}
            </div>

            <div class="history-status">
              ${escapeHTML(
                item.status || "-"
              )}
            </div>

          </div>

          <div class="history-amount">
            ${escapeHTML(item.amount)}
          </div>

          <div class="history-date">
            ${escapeHTML(
              formatDate(item.date)
            )}
          </div>

        </div>

      `).join("");

  }


  /*
   * ------------------------------------------
   * ESCAPE
   * ------------------------------------------
   */

  function escapeHTML(value) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,
      char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char])
    );

  }


  /*
   * ------------------------------------------
   * INIT
   * ------------------------------------------
   */

  async function initMining() {

    try {

      const logged =
        await loadUser();


      if (!logged) return;


      document.getElementById(
        "syncText"
      ).textContent =
        "Menghubungkan ke server...";


      await loadConfig();


      await loadMiningStatus();


      await loadMiningWallet();


      await loadIDRWallet();


      await loadHistory();


      if (
        miningSession?.status ===
        "active"
      ) {

        startHeartbeat();

      } else {

        stopHeartbeat();

      }


      startStatusCheck();


      document.getElementById(
        "syncText"
      ).textContent =
        "Server tersinkron: " +
        new Date().toLocaleTimeString(
          "id-ID"
        );


    } catch (error) {

      console.error(
        "INIT MINING ERROR:",
        error
      );


      toast(
        error?.message ||
        "Gagal memuat halaman mining."
      );

    }

  }


  /*
   * ------------------------------------------
   * CLEANUP
   * ------------------------------------------
   */

  window.addEventListener(
    "beforeunload",
    () => {

      stopHeartbeat();

      if (statusTimer) {

        clearInterval(
          statusTimer
        );

      }

    }
  );


  /*
   * START
   */

  initMining();

</script>

</body>
</html>
