<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank & E-Wallet</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

:root{
  --bg:#07090b;
  --panel:#121417;
  --panel2:#0d0f12;
  --gold:#f3c95f;
  --gold2:#ffe7a0;
  --muted:#92959e;
  --text:#f5f5f6;
  --line:rgba(243,201,95,.30);
  --danger:#d75b5b;
  --success:#9ce5b2;
}

html{
  background:var(--bg)
}

body{
  min-height:100vh;
  padding-bottom:88px;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 3%,rgba(243,201,95,.14),transparent 25%),
    radial-gradient(circle at 92% 36%,rgba(243,201,95,.065),transparent 28%),
    linear-gradient(145deg,#07090b 0%,#121417 52%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);
  background-size:27px 27px;
}

header{
  position:relative;
  z-index:1;
  text-align:center;
  padding:23px 18px 19px;
  background:
    linear-gradient(
      180deg,
      rgba(15,17,19,.96),
      rgba(15,17,19,.72)
    );
  border-bottom:1px solid rgba(243,201,95,.22);
}

header h2{
  font-size:24px;
  color:var(--gold2);
  font-weight:800;
  letter-spacing:.1px;
}

.container{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:auto;
  padding:18px 15px;
}

.card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(243,201,95,.045),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(27,29,29,.98),
      rgba(11,13,16,.99)
    );
  border:1px solid var(--line);
  border-radius:25px;
  padding:21px;
  margin-bottom:17px;
  box-shadow:0 18px 55px rgba(0,0,0,.38);
}

.card:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-105px;
  top:-95px;
  border:1px solid rgba(243,201,95,.14);
  border-radius:50%;
  pointer-events:none;
}

h3{
  color:var(--text);
  font-size:20px;
  margin-bottom:15px;
  letter-spacing:-.2px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:7px;
  color:#bfc1c7;
  font-size:13px;
  font-weight:650;
}

input,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid rgba(243,201,95,.22);
  border-radius:13px;
  background:#0b0d10;
  color:#f5f5f6;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:#656872
}

input:focus,
select:focus{
  border-color:rgba(243,201,95,.75);
  box-shadow:0 0 0 3px rgba(243,201,95,.07);
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  background:
    linear-gradient(
      135deg,
      #ffe8a6,
      #d8a83a
    );
  color:#18140b;
  border:1px solid rgba(255,231,160,.72);
  border-radius:14px;
  font-size:14px;
  font-weight:850;
  cursor:pointer;
  box-shadow:0 9px 25px rgba(243,201,95,.15);
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 30px rgba(243,201,95,.22);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

.bank-item{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(243,201,95,.09),
      rgba(243,201,95,.025)
    );
  border:1px solid rgba(243,201,95,.19);
  padding:16px;
  border-radius:16px;
  margin-top:13px;
  box-shadow:0 10px 25px rgba(0,0,0,.20);
}

.bank-item p{
  margin:7px 0;
  color:#b9bbc1;
  font-size:13px;
}

.bank-item b{
  color:var(--gold2)
}

.bank-method{
  font-size:17px;
  font-weight:800;
  color:var(--gold2);
  margin-bottom:7px;
}

.bank-number{
  font-size:14px;
  color:#fff;
  letter-spacing:.3px;
}

.bank-name{
  font-size:13px;
  color:#b9bbc1;
}

.default-label{
  display:inline-block;
  margin-top:7px;
  padding:4px 9px;
  border-radius:20px;
  background:rgba(243,201,95,.10);
  border:1px solid rgba(243,201,95,.22);
  color:var(--gold2);
  font-size:10px;
}

.delete{
  margin-top:12px;
  background:
    linear-gradient(
      135deg,
      #4a2424,
      #2b1515
    );
  color:#ffcaca;
  border:1px solid rgba(215,91,91,.35);
  box-shadow:none;
}

.delete:hover{
  background:
    linear-gradient(
      135deg,
      #5a2929,
      #351818
    );
  box-shadow:none;
}

#listBank>p{
  color:#747780;
  font-size:13px;
  padding:7px 0;
}

.message{
  display:none;
  padding:12px 14px;
  border-radius:13px;
  margin-bottom:14px;
  font-size:12px;
  line-height:1.5;
}

.message.error{
  background:#241313;
  border:1px solid rgba(215,91,91,.38);
  color:#ffcaca;
}

.message.success{
  background:#102018;
  border:1px solid rgba(93,180,120,.35);
  color:#b8f0c8;
}

.loading{
  color:#92959e;
  font-size:12px;
  padding:12px 0;
  text-align:center;
}

.empty{
  color:#747780;
  font-size:13px;
  padding:7px 0;
  text-align:center;
}

.bottom{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:rgba(7,9,11,.97);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(243,201,95,.18);
  display:flex;
  justify-content:space-around;
  padding:7px 4px;
}

.bottom a{
  flex:1;
  text-decoration:none;
  color:#777b84;
  text-align:center;
  font-size:10px;
  padding-top:1px;
}

.bottom span{
  display:block;
  font-size:19px;
  line-height:24px;
  margin-bottom:2px;
  filter:grayscale(.15);
  transform:scale(.78);
}

@media(max-width:420px){

  .container{
    padding:14px 12px
  }

  .card{
    padding:18px;
    border-radius:22px
  }

  header h2{
    font-size:22px
  }

  .bottom span{
    font-size:18px;
    transform:scale(.76)
  }

}
</style>

<link rel="stylesheet" href="premium-brand.css">

</head>

<body>

<header>

<div class="sp-header-brand">

  <img
    class="sp-logo"
    src="logo.png"
    alt="MyShort Logo">

  <div>

    <strong>MyShort App</strong>

    <small>Member Area</small>

  </div>

</div>

<h2>Bank & E-Wallet</h2>

</header>


<div class="container">


<!-- PESAN -->

<div
  id="message"
  class="message">
</div>


<!-- TAMBAH REKENING -->

<div class="card">

<h3>Tambah Rekening</h3>


<label>
  Bank / E-Wallet
</label>

<select id="bank">

  <option value="">
    Pilih Bank / E-Wallet
  </option>

  <option value="BRI">
    BRI
  </option>

  <option value="DANA">
    DANA
  </option>

  <option value="OVO">
    OVO
  </option>

  <option value="GoPay">
    GoPay
  </option>

  <option value="ShopeePay">
    ShopeePay
  </option>

</select>


<label id="namaLabel">
  Nama Pemilik Rekening
</label>

<input
  type="text"
  id="nama"
  autocomplete="name"
  placeholder="Nama sesuai rekening">


<label id="nomorLabel">
  Nomor Rekening
</label>

<input
  type="text"
  id="rekening"
  inputmode="numeric"
  autocomplete="tel"
  placeholder="Masukkan nomor rekening">


<button
  id="saveBtn"
  type="button"
  onclick="simpanBank()">

  Simpan Rekening

</button>

</div>


<!-- DAFTAR -->

<div class="card">

<h3>
  Daftar Rekening
</h3>

<div id="listBank">

  <div class="loading">
    Memuat rekening...
  </div>

</div>

</div>


</div>


<!-- BOTTOM -->

<div class="bottom">

<a href="dashboard.html">

  <span>🏠</span>

  Home

</a>


<a href="wallet.html">

  <span>💰</span>

  Wallet

</a>


<a href="mission.html">

  <span>🎯</span>

  Mission

</a>


<a href="profile.html">

  <span>👤</span>

  Profile

</a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>

<script src="pages.js"></script>


<script>

/* =========================================
   BANK & E-WALLET MYSHORT
   ========================================= */


/*
  Supabase client.
  Jika supabase-config.js sudah membuat
  window.sb, gunakan client tersebut.

  Jika tidak, buat client menggunakan
  konfigurasi yang tersedia.
*/

let sbClient = null;


/* =========================================
   CEK CLIENT SUPABASE
   ========================================= */

function getSupabaseClient(){

  /*
    Prioritas:
    1. window.sb
    2. window.supabaseClient
    3. konfigurasi global
  */

  if(
    window.sb &&
    window.sb.auth &&
    typeof window.sb.from === "function"
  ){

    return window.sb;

  }


  if(
    window.supabaseClient &&
    window.supabaseClient.auth
  ){

    return window.supabaseClient;

  }


  /*
    Fallback konfigurasi project
  */

  const url =
    "https://jywzhwvbyifulqqvgxxd.supabase.co";

  const key =
    "sb_publishable_2leqwU4YWbTg--GCIfQMmA_zOEKKG60";


  if(
    window.supabase &&
    typeof window.supabase.createClient === "function"
  ){

    return window.supabase.createClient(
      url,
      key,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

  }


  return null;

}


sbClient =
  getSupabaseClient();


/* =========================================
   ELEMENT
   ========================================= */

const bankSelect =
  document.getElementById("bank");

const namaInput =
  document.getElementById("nama");

const rekeningInput =
  document.getElementById("rekening");

const saveBtn =
  document.getElementById("saveBtn");

const listBank =
  document.getElementById("listBank");

const message =
  document.getElementById("message");

const namaLabel =
  document.getElementById("namaLabel");

const nomorLabel =
  document.getElementById("nomorLabel");


let currentUser = null;


/* =========================================
   PESAN
   ========================================= */

function showMessage(
  type,
  text
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function hideMessage(){

  message.style.display =
    "none";

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =========================================
   UPDATE LABEL E-WALLET
   ========================================= */

function updatePaymentLabels(){

  const value =
    bankSelect.value;


  const isEwallet =
    [
      "DANA",
      "OVO",
      "GoPay",
      "ShopeePay"
    ].includes(value);


  if(isEwallet){

    namaLabel.textContent =
      "Nama Pemilik E-Wallet";

    nomorLabel.textContent =
      "Nomor HP / Nomor E-Wallet";

    rekeningInput.placeholder =
      "Masukkan nomor HP / nomor e-wallet";

    rekeningInput.inputMode =
      "tel";

  }else{

    namaLabel.textContent =
      "Nama Pemilik Rekening";

    nomorLabel.textContent =
      "Nomor Rekening";

    rekeningInput.placeholder =
      "Masukkan nomor rekening";

    rekeningInput.inputMode =
      "numeric";

  }

}


bankSelect.addEventListener(
  "change",
  updatePaymentLabels
);

updatePaymentLabels();


/* =========================================
   CEK LOGIN
   ========================================= */

async function cekLogin(){

  if(!sbClient){

    throw new Error(
      "Supabase belum berhasil dimuat."
    );

  }


  const {
    data,
    error
  } =
    await sbClient.auth.getUser();


  if(error){

    throw error;

  }


  if(!data?.user){

    showMessage(
      "error",
      "Sesi login tidak ditemukan. Silakan login kembali."
    );


    setTimeout(
      function(){

        location.href =
          "index.html";

      },
      1200
    );


    return null;

  }


  currentUser =
    data.user;


  return currentUser;

}


/* =========================================
   LOAD BANK
   ========================================= */

async function loadBank(){

  listBank.innerHTML =
    `
    <div class="loading">
      Memuat rekening...
    </div>
    `;


  try{

    if(!currentUser){

      await cekLogin();

    }


    if(!currentUser)
      return;


    const {
      data,
      error
    } =
      await sbClient
        .from("bank_accounts")
        .select(
          "id,user_id,method,account_number,account_name,is_default,created_at"
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "is_default",
          {
            ascending:false
          }
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    if(!data || data.length === 0){

      listBank.innerHTML =
        `
        <div class="empty">
          Belum ada rekening atau e-wallet tersimpan.
        </div>
        `;

      return;

    }


    listBank.innerHTML =
      data.map(
        function(item){

          return `

          <div class="bank-item">

            <div class="bank-method">
              ${esc(item.method)}
            </div>

            <p class="bank-number">
              <b>Nomor:</b>
              ${esc(item.account_number)}
            </p>

            <p class="bank-name">
              <b>Nama:</b>
              ${esc(item.account_name)}
            </p>

            ${
              item.is_default
              ?
              `
              <span class="default-label">
                Rekening Utama
              </span>
              `
              :
              ""
            }

            <button
              class="delete"
              type="button"
              onclick="hapusBank(${Number(item.id)})">

              Hapus Rekening

            </button>

          </div>

          `;

        }
      ).join("");


  }catch(error){

    console.error(
      "LOAD BANK ERROR:",
      error
    );


    listBank.innerHTML =
      `
      <div class="empty">
        Gagal memuat rekening.
      </div>
      `;


    showMessage(
      "error",
      error.message ||
      "Gagal membaca data rekening dari Supabase."
    );

  }

}


/* =========================================
   SIMPAN BANK
   ========================================= */

async function simpanBank(){

  hideMessage();


  /*
    CEK CLIENT
  */

  if(!sbClient){

    showMessage(
      "error",
      "Supabase belum siap. Coba refresh halaman."
    );

    return;

  }


  /*
    CEK LOGIN
  */

  try{

    if(!currentUser){

      await cekLogin();

    }

  }catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );


    showMessage(
      "error",
      error.message ||
      "Sesi login tidak ditemukan."
    );

    return;

  }


  if(!currentUser){

    return;

  }


  /*
    AMBIL FORM
  */

  const method =
    bankSelect.value.trim();

  const accountName =
    namaInput.value.trim();

  const accountNumber =
    rekeningInput.value.trim();


  /*
    VALIDASI METODE
  */

  const allowedMethods =
    [
      "BRI",
      "DANA",
      "OVO",
      "GoPay",
      "ShopeePay"
    ];


  if(
    !allowedMethods.includes(method)
  ){

    showMessage(
      "error",
      "Silakan pilih BRI atau e-wallet yang tersedia."
    );

    bankSelect.focus();

    return;

  }


  /*
    VALIDASI NAMA
  */

  if(!accountName){

    showMessage(
      "error",
      "Nama pemilik wajib diisi."
    );

    namaInput.focus();

    return;

  }


  if(accountName.length < 2){

    showMessage(
      "error",
      "Nama pemilik terlalu pendek."
    );

    namaInput.focus();

    return;

  }


  /*
    VALIDASI NOMOR
  */

  if(!accountNumber){

    showMessage(
      "error",
      "Nomor rekening / e-wallet wajib diisi."
    );

    rekeningInput.focus();

    return;

  }


  /*
    Nomor hanya boleh berisi
    angka, spasi, +, -, atau tanda kurung.
  */

  const cleanNumber =
    accountNumber.replace(
      /[\s\-()+]/g,
      ""
    );


  if(
    !/^\d+$/.test(cleanNumber)
  ){

    showMessage(
      "error",
      "Nomor rekening / e-wallet hanya boleh berisi angka."
    );

    rekeningInput.focus();

    return;

  }


  if(cleanNumber.length < 8){

    showMessage(
      "error",
      "Nomor rekening / e-wallet terlalu pendek."
    );

    rekeningInput.focus();

    return;

  }


  /*
    DISABLE BUTTON
  */

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "MENYIMPAN...";


  try{

    /*
      INSERT LANGSUNG KE
      public.bank_accounts

      user_id diambil dari
      session Supabase.
    */

    const {
      data,
      error
    } =
      await sbClient
        .from("bank_accounts")
        .insert({

          user_id:
            currentUser.id,

          method:
            method,

          account_number:
            accountNumber,

          account_name:
            accountName,

          is_default:
            false

        })
        .select()
        .single();


    if(error){

      throw error;

    }


    console.log(
      "BANK ACCOUNT SAVED:",
      data
    );


    showMessage(
      "success",
      "Rekening / e-wallet berhasil disimpan."
    );


    /*
      RESET FORM
    */

    bankSelect.value =
      "";

    namaInput.value =
      "";

    rekeningInput.value =
      "";

    updatePaymentLabels();


    /*
      REFRESH DAFTAR
    */

    await loadBank();


  }catch(error){

    console.error(
      "SAVE BANK ERROR:",
      error
    );


    let text =
      error.message ||
      "Gagal menyimpan rekening.";


    /*
      Pesan yang lebih mudah
      dipahami member.
    */

    if(
      error.code === "42501"
    ){

      text =
        "Tidak memiliki izin untuk menyimpan rekening. Pastikan member sudah login ke Supabase.";

    }


    if(
      error.code === "23503"
    ){

      text =
        "Data user tidak ditemukan di profil Supabase.";

    }


    if(
      error.code === "23505"
    ){

      text =
        "Data rekening tersebut sudah tersimpan.";

    }


    showMessage(
      "error",
      text
    );


  }finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "Simpan Rekening";

  }

}


/* =========================================
   HAPUS BANK
   ========================================= */

async function hapusBank(id){

  hideMessage();


  if(!currentUser){

    showMessage(
      "error",
      "Sesi login tidak ditemukan."
    );

    return;

  }


  const yakin =
    confirm(
      "Hapus rekening / e-wallet ini?"
    );


  if(!yakin)
    return;


  try{

    const {
      error
    } =
      await sbClient
        .from("bank_accounts")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){

      throw error;

    }


    showMessage(
      "success",
      "Rekening berhasil dihapus."
    );


    await loadBank();


  }catch(error){

    console.error(
      "DELETE BANK ERROR:",
      error
    );


    showMessage(
      "error",
      error.message ||
      "Gagal menghapus rekening."
    );

  }

}


/* =========================================
   AUTH CHANGE
   ========================================= */

if(
  sbClient &&
  sbClient.auth
){

  sbClient.auth.onAuthStateChange(
    function(event){

      if(
        event ===
        "SIGNED_OUT"
      ){

        location.href =
          "index.html";

      }

    }
  );

}


/* =========================================
   START
   ========================================= */

(async function(){

  try{

    const user =
      await cekLogin();


    if(user){

      await loadBank();

    }

  }catch(error){

    console.error(
      "BANK PAGE ERROR:",
      error
    );


    showMessage(
      "error",
      error.message ||
      "Gagal membuka halaman Bank & E-Wallet."
    );

  }

})();

</script>

</body>
