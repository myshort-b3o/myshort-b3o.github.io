<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank & E-Wallet</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
:root{
  --bg:#07090b;
  --panel:#121417;
  --panel2:#0d0f12;
  --gold:#f3c95f;
  --gold2:#ffe7a0;
  --muted:#92959e;
  --text:#f5f5f6;
  --line:rgba(243,201,95,.30);
  --danger:#d75b5b;
}
html{background:var(--bg)}
body{
  min-height:100vh;
  padding-bottom:88px;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 3%,rgba(243,201,95,.14),transparent 25%),
    radial-gradient(circle at 92% 36%,rgba(243,201,95,.065),transparent 28%),
    linear-gradient(145deg,#07090b 0%,#121417 52%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);
  background-size:27px 27px;
}
header{
  position:relative;z-index:1;
  text-align:center;
  padding:23px 18px 19px;
  background:linear-gradient(180deg,rgba(15,17,19,.96),rgba(15,17,19,.72));
  border-bottom:1px solid rgba(243,201,95,.22);
}
header h2{
  font-size:24px;
  color:var(--gold2);
  font-weight:800;
  letter-spacing:.1px;
}
.container{
  position:relative;z-index:1;
  max-width:760px;
  margin:auto;
  padding:18px 15px;
}
.card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(243,201,95,.045),transparent 34%),
    linear-gradient(145deg,rgba(27,29,29,.98),rgba(11,13,16,.99));
  border:1px solid var(--line);
  border-radius:25px;
  padding:21px;
  margin-bottom:17px;
  box-shadow:0 18px 55px rgba(0,0,0,.38);
}
.card:after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-105px;top:-95px;
  border:1px solid rgba(243,201,95,.14);
  border-radius:50%;
  pointer-events:none;
}
h3{
  color:var(--text);
  font-size:20px;
  margin-bottom:15px;
  letter-spacing:-.2px;
}
label{
  display:block;
  margin-top:14px;
  margin-bottom:7px;
  color:#bfc1c7;
  font-size:13px;
  font-weight:650;
}
input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid rgba(243,201,95,.22);
  border-radius:13px;
  background:#0b0d10;
  color:#f5f5f6;
  font-size:14px;
  outline:none;
}
input::placeholder{color:#656872}
input:focus,select:focus{
  border-color:rgba(243,201,95,.75);
  box-shadow:0 0 0 3px rgba(243,201,95,.07);
}
button{
  width:100%;
  padding:14px;
  margin-top:18px;
  background:linear-gradient(135deg,#ffe8a6,#d8a83a);
  color:#18140b;
  border:1px solid rgba(255,231,160,.72);
  border-radius:14px;
  font-size:14px;
  font-weight:850;
  cursor:pointer;
  box-shadow:0 9px 25px rgba(243,201,95,.15);
}
button:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 30px rgba(243,201,95,.22);
}
.bank-item{
  position:relative;
  background:linear-gradient(145deg,rgba(243,201,95,.09),rgba(243,201,95,.025));
  border:1px solid rgba(243,201,95,.19);
  padding:16px;
  border-radius:16px;
  margin-top:13px;
  box-shadow:0 10px 25px rgba(0,0,0,.20);
}
.bank-item p{
  margin:7px 0;
  color:#b9bbc1;
  font-size:13px;
}
.bank-item b{color:var(--gold2)}
.delete{
  margin-top:12px;
  background:linear-gradient(135deg,#4a2424,#2b1515);
  color:#ffcaca;
  border:1px solid rgba(215,91,91,.35);
  box-shadow:none;
}
.delete:hover{
  background:linear-gradient(135deg,#5a2929,#351818);
  box-shadow:none;
}
#listBank>p{
  color:#747780;
  font-size:13px;
  padding:7px 0;
}
.bottom{
  position:fixed;
  z-index:20;
  bottom:0;left:0;width:100%;
  height:78px;
  background:rgba(7,9,11,.97);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(243,201,95,.18);
  display:flex;
  justify-content:space-around;
  padding:7px 4px;
}
.bottom a{
  flex:1;
  text-decoration:none;
  color:#777b84;
  text-align:center;
  font-size:10px;
  padding-top:1px;
}
.bottom span{
  display:block;
  font-size:19px;
  line-height:24px;
  margin-bottom:2px;
  filter:grayscale(.15);
  transform:scale(.78);
}
@media(max-width:420px){
  .container{padding:14px 12px}
  .card{padding:18px;border-radius:22px}
  header h2{font-size:22px}
  .bottom span{font-size:18px;transform:scale(.76)}
}
</style>

<link rel="stylesheet" href="premium-brand.css">
</head>

<body>

<header>

<div class="sp-header-brand"><img class="sp-logo" src="logo.png" alt="MyShort Logo"><div><strong>MyShort App</strong><small>Member Area</small></div></div><h2>Bank & E-Wallet</h2>

</header>

<div class="container">

<div class="card">

<h3>Tambah Rekening</h3>

<label>Nama Bank</label>

<select id="bank">

<option value="">Pilih Bank</option>

<option>BCA</option>

<option>BRI</option>

<option>BNI</option>

<option>Mandiri</option>

<option>CIMB Niaga</option>

<option>Permata</option>

<option>BTN</option>

<option>BSI</option>
<option>ShopeePay</option>
<option>GoPay</option>
<option>OVO</option>

</select>

<label>Nama Pemilik Rekening</label>

<input
type="text"
id="nama"
placeholder="Nama sesuai rekening">

<label>Nomor Rekening</label>

<input
type="text"
id="rekening"
placeholder="Masukkan nomor rekening">

<button onclick="simpanBank()">

Simpan Rekening

</button>

</div>

<div class="card">

<h3>Daftar Rekening</h3>

<div id="listBank">

<p>Belum ada rekening.</p>

</div>

</div>

</div>

<div class="bottom">

<a href="dashboard.html">

<span>🏠</span>

Home

</a>

<a href="wallet.html">

<span>💰</span>

Wallet

</a>

<a href="mission.html">

<span>🎯</span>

Mission

</a>

<a href="profile.html">

<span>👤</span>

</a>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script>
const bankSelect = document.getElementById('bank');
const paymentLabels = document.querySelectorAll('.card:first-of-type label');

function updatePaymentLabels(){
  const ewallet = ['ShopeePay','GoPay','OVO'].includes(bankSelect.value);
  if(paymentLabels[1]) paymentLabels[1].textContent = ewallet ? 'Nama Pemilik E-Wallet' : 'Nama Pemilik Rekening';
  if(paymentLabels[2]) paymentLabels[2].textContent = ewallet ? 'Nomor HP / Nomor E-Wallet' : 'Nomor Rekening';
}
bankSelect.addEventListener('change', updatePaymentLabels);
updatePaymentLabels();
</script>
</body>

</html>
