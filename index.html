<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#ffffff"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<title>MyShort — XMR Mining Center</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   HTML / BODY
===================================================== */

html,
body{
    width:100%;
    height:100%;
}


body{
    min-height:100vh;
    min-height:100dvh;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#ffffff;

    color:#111111;
}


/* =====================================================
   SCREEN
===================================================== */

.screen{

    width:100%;
    height:100vh;
    height:100dvh;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#ffffff;

}


/* =====================================================
   BACKGROUND GRID
===================================================== */

.screen::before{

    content:"";

    position:absolute;

    left:-20%;
    right:-20%;
    top:42%;
    bottom:-15%;

    opacity:.40;

    background:

        linear-gradient(
            rgba(120,135,160,.10) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(120,135,160,.10) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    transform:
        perspective(520px)
        rotateX(58deg)
        scale(1.35);

    transform-origin:center top;

    pointer-events:none;

}


/* =====================================================
   BACKGROUND FADE
===================================================== */

.screen::after{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            to bottom,
            rgba(255,255,255,1) 0%,
            rgba(255,255,255,.96) 30%,
            rgba(255,255,255,.65) 62%,
            rgba(255,255,255,.96) 100%
        );

    pointer-events:none;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

    width:100%;
    max-width:520px;

    min-height:100%;

    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px 22px;

}


/* =====================================================
   LOGO
   UKURAN TETAP SEPERTI FILE ASLI
===================================================== */

.logo{

    width:205px;
    height:205px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    position:relative;

}


/* =====================================================
   BINGKAI LOGO MYSHORT
   TIPIS + PROFESIONAL
===================================================== */

.logo::before{

    content:"";

    position:absolute;

    inset:8px;

    border:1px solid #cfd2d5;

    border-radius:4px;

    background:#f7f6f2;

    box-shadow:

        0 8px 18px
        rgba(35,40,45,.08),

        inset 0 0 0 1px
        rgba(255,255,255,.85);

    z-index:0;

}


/* =====================================================
   BINGKAI DALAM LOGO
===================================================== */

.logo::after{

    content:"";

    position:absolute;

    inset:13px;

    border:1px solid rgba(174,178,183,.55);

    border-radius:2px;

    z-index:1;

    pointer-events:none;

}


/*
   LOGO ASLI
   Tidak diubah warnanya.
*/

.logo img{

    position:relative;

    z-index:2;

    width:184px;
    height:184px;

    object-fit:contain;

    display:block;

}


/* =====================================================
   NAMA MYSHORT
===================================================== */

.brand{

    margin-top:12px;

    font-size:45px;

    line-height:1;

    letter-spacing:-1.5px;

    font-weight:700;

    color:#111111;

    text-align:center;

}


/* =====================================================
   MYSHORT MINING CENTER
===================================================== */

.tagline{

    margin-top:18px;

    color:#7b8799;

    font-size:13px;

    line-height:1;

    letter-spacing:4px;

    font-weight:500;

    white-space:nowrap;

    text-align:center;

}


/* =====================================================
   TEKS LOGIN
===================================================== */

.login-title{

    margin-top:34px;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;

    color:#a2a9b3;

    font-size:13px;

    font-weight:400;

}


.login-title::before,
.login-title::after{

    content:"";

    width:58px;
    height:1px;

    background:#d8dce2;

}


/* =====================================================
   LOGIN BUTTON
   TETAP 200 x 56 PX
===================================================== */

.login-button{

    width:200px;

    height:56px;

    margin-top:18px;

    border:none;

    border-radius:16px;

    background:

        linear-gradient(
            145deg,
            #07111f,
            #020711
        );

    color:#ffffff;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    font-size:16px;

    font-weight:700;

    letter-spacing:.3px;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,.17);

    transition:

        transform .15s ease,
        box-shadow .15s ease;

}


.login-button:hover{

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.22);

}


.login-button:active{

    transform:scale(.975);

    box-shadow:

        0 4px 10px
        rgba(0,0,0,.18);

}


/* =====================================================
   LOGIN ICON
===================================================== */

.login-icon{

    width:22px;
    height:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

}


.login-icon svg{

    width:22px;
    height:22px;

    display:block;

}


/* =====================================================
   SOCIAL
   TETAP KECIL SEPERTI FILE ASLI
===================================================== */

.social-area{

    margin-top:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

}


/* =====================================================
   SOCIAL CIRCLE
===================================================== */

.social{

    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#222f45;

    background:#ffffff;

    border:

        1px solid
        #dfe4eb;

    box-shadow:

        0 5px 14px
        rgba(30,60,100,.10);

    transition:

        transform .15s ease,
        background .15s ease;

}


.social:hover{

    background:#f5f7fa;

}


.social:active{

    transform:scale(.90);

}


/* =====================================================
   SOCIAL SVG
   ICON DIPERKECIL
===================================================== */

.social svg{

    width:17px;
    height:17px;

    display:block;

    fill:currentColor;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:22px;

    color:#a1a9b5;

    font-size:9px;

    letter-spacing:2px;

    opacity:.75;

}


/* =====================================================
   HP KECIL
===================================================== */

@media(max-width:390px){

    .content{

        padding:
            18px;

    }


    .logo{

        width:175px;
        height:175px;

    }


    .logo::before{

        inset:7px;

    }


    .logo::after{

        inset:11px;

    }


    .logo img{

        width:158px;
        height:158px;

    }


    .brand{

        font-size:40px;

        margin-top:10px;

    }


    .tagline{

        margin-top:15px;

        font-size:10px;

        letter-spacing:3px;

    }


    .login-title{

        margin-top:28px;

        font-size:12px;

        gap:10px;

    }


    .login-title::before,
    .login-title::after{

        width:45px;

    }


    .login-button{

        width:200px;

        max-width:92%;

        height:56px;

        margin-top:16px;

    }


    .social-area{

        margin-top:20px;

        gap:11px;

    }


    .social{

        width:37px;
        height:37px;

    }


    .social svg{

        width:16px;
        height:16px;

    }


    .footer{

        margin-top:18px;

    }

}


/* =====================================================
   HP PENDEK
===================================================== */

@media(max-height:680px){

    .logo{

        width:150px;
        height:150px;

    }


    .logo::before{

        inset:6px;

    }


    .logo::after{

        inset:9px;

    }


    .logo img{

        width:136px;
        height:136px;

    }


    .brand{

        font-size:36px;

        margin-top:8px;

    }


    .tagline{

        margin-top:13px;

        font-size:9px;

        letter-spacing:3px;

    }


    .login-title{

        margin-top:22px;

    }


    .login-button{

        margin-top:14px;

        width:200px;

        height:56px;

    }


    .social-area{

        margin-top:17px;

    }


    .footer{

        margin-top:15px;

    }

}


/* =====================================================
   HP SANGAT PENDEK
===================================================== */

@media(max-height:580px){

    .logo{

        width:125px;
        height:125px;

    }


    .logo::before{

        inset:5px;

    }


    .logo::after{

        inset:8px;

    }


    .logo img{

        width:113px;
        height:113px;

    }


    .brand{

        font-size:32px;

        margin-top:7px;

    }


    .tagline{

        margin-top:10px;

        font-size:8px;

        letter-spacing:2.5px;

    }


    .login-title{

        margin-top:17px;

        font-size:11px;

    }


    .login-button{

        width:200px;

        max-width:92%;

        height:52px;

        margin-top:12px;

    }


    .social-area{

        margin-top:13px;

    }


    .social{

        width:34px;
        height:34px;

    }


    .social svg{

        width:15px;
        height:15px;

    }


    .footer{

        margin-top:11px;

    }

}

</style>

</head>


<body>


<div class="screen">


    <main class="content">


        <!-- =================================================
             LOGO MYSHORT
        ================================================== -->

        <div class="logo">

            <img

                <svg viewBox="0 0 24 24">

                    <path d="

            <a

        </div>


        <!-- =================================================

        ================================================== -->

        <div class="footer">

        </div>


    </main>


</div>

</html>
