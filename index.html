<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#ffffff"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<title>MyShort — تطبيق التعدين مدرج في متجر العملات المشفرة.د</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   HTML / BODY
===================================================== */

html,
body{
    width:100%;
    height:100%;
}


body{
    min-height:100vh;
    min-height:100dvh;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#ffffff;

    color:#17356f;
}


/* =====================================================
   SCREEN
===================================================== */

.screen{
    width:100%;
    height:100vh;
    height:100dvh;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#ffffff;

    overflow:hidden;
}


/* =====================================================
   CONTENT
===================================================== */

.content{

    width:100%;
    max-width:520px;

    min-height:100%;

    padding:25px 22px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}


/* =====================================================
   LOGO
===================================================== */

.logo-frame{

    width:205px;
    height:205px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

}


.logo-frame img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

}


/* =====================================================
   MYSHORT
===================================================== */

.brand{

    margin-top:14px;

    font-size:45px;

    line-height:1;

    letter-spacing:-1.5px;

    font-weight:400;

    color:#1755c8;

    text-transform:lowercase;

    text-align:center;

}


/* =====================================================
   MYSHORT MINING CENTER
===================================================== */

.tagline{

    margin-top:18px;

    color:#617395;

    font-size:14px;

    line-height:1;

    letter-spacing:5px;

    font-weight:500;

    white-space:nowrap;

    text-align:center;

}


/* =====================================================
   LOGIN BUTTON
   UKURAN NORMAL
   200px x 56px
===================================================== */

.login-button{

    width:200px;
    height:56px;

    margin-top:38px;

    border:1px solid #246ee8;

    border-radius:17px;

    background:

        linear-gradient(
            145deg,
            #304a82,
            #263d70
        );

    color:#ffffff;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    font-size:16px;

    font-weight:700;

    letter-spacing:.3px;

    box-shadow:

        0 10px 28px
        rgba(0,0,0,.18),

        inset
        0 1px 0
        rgba(255,255,255,.10);

    transition:

        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;

}


.login-button:hover{

    background:

        linear-gradient(
            145deg,
            #38558f,
            #2b4378
        );

}


.login-button:active{

    transform:scale(.975);

    box-shadow:

        0 0 8px
        rgba(37,169,255,.28);

}


/* =====================================================
   LOGIN ICON
===================================================== */

.login-icon{

    width:22px;
    height:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

}


.login-icon svg{

    width:22px;
    height:22px;

    display:block;

}


/* =====================================================
   SOCIAL
===================================================== */

.social-area{

    margin-top:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

}


/* =====================================================
   SOCIAL BUTTON
===================================================== */

.social{

    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#2c68c5;

    background:#ffffff;

    border:
        1px solid
        #d4e0f3;

    box-shadow:

        0 5px 14px
        rgba(31,70,130,.12);

    transition:

        transform .18s ease,
        background .18s ease;

}


.social:hover{

    background:#f3f7ff;

}


.social:active{

    transform:scale(.90);

}


/* =====================================================
   SOCIAL SVG
===================================================== */

.social svg{

    width:18px;
    height:18px;

    display:block;

    fill:currentColor;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:25px;

    color:#91a1bb;

    font-size:9px;

    letter-spacing:2px;

    opacity:.75;

}


/* =====================================================
   HP KECIL
===================================================== */

@media(max-width:390px){

    .content{

        padding:
            20px 18px;

    }


    .logo-frame{

        width:175px;
        height:175px;

    }


    .brand{

        font-size:40px;

        margin-top:12px;

    }


    .tagline{

        font-size:11px;

        letter-spacing:3.5px;

        margin-top:16px;

    }


    /*
       LOGIN TETAP NORMAL
       tetapi sedikit menyesuaikan layar
    */

    .login-button{

        width:200px;
        max-width:92%;

        height:56px;

        margin-top:30px;

    }


    .social-area{

        margin-top:20px;

        gap:11px;

    }


    .social{

        width:37px;
        height:37px;

    }


    .footer{

        margin-top:18px;

    }

}


/* =====================================================
   HP PENDEK
===================================================== */

@media(max-height:680px){

    .logo-frame{

        width:150px;
        height:150px;

    }


    .brand{

        font-size:36px;

        margin-top:10px;

    }


    .tagline{

        margin-top:14px;

        font-size:10px;

        letter-spacing:3px;

    }


    .login-button{

        width:200px;
        max-width:92%;

        height:56px;

        margin-top:25px;

    }


    .social-area{

        margin-top:18px;

    }


    .footer{

        margin-top:15px;

    }

}


/* =====================================================
   HP SANGAT PENDEK
===================================================== */

@media(max-height:580px){

    .logo-frame{

        width:125px;
        height:125px;

    }


    .brand{

        font-size:32px;

        margin-top:8px;

    }


    .tagline{

        margin-top:11px;

        font-size:9px;

        letter-spacing:2.5px;

    }


    .login-button{

        width:200px;
        max-width:92%;

        height:56px;

        margin-top:20px;

    }


    .social-area{

        margin-top:14px;

    }


    .social{

        width:34px;
        height:34px;

    }


    .social svg{

        width:16px;
        height:16px;

    }


    .footer{

        margin-top:11px;

    }

}

</style>

</head>


<body>


<div class="screen">


    <main class="content">


        <!-- =================================================
             LOGO MYSHORT
        ================================================== -->

        <div class="logo-frame">

            <img
                src="logo.png"
                alt="MyShort Logo"
            >

        </div>


        <!-- =================================================
             NAMA MYSHORT
        ================================================== -->

        <div class="brand">

            myshort

        </div>


        <!-- =================================================
             SUBTITLE
        ================================================== -->

        <div class="tagline">

            تطبيق التعدين مدرج في متجر العملات المشفرة

        </div>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <a
            href="login.html"
            class="login-button"
            aria-label="Login atau Masuk"
        >

            <span class="login-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="16"
                        rx="3"
                    ></rect>

                    <path
                        d="M8 12h8"
                    ></path>

                    <path
                        d="M13 9l3 3-3 3"
                    ></path>

                </svg>

            </span>


            LOGIN / MASUK


        </a>


        <!-- =================================================
             SOCIAL MEDIA
        ================================================== -->

        <div class="social-area">


            <!-- FACEBOOK -->

            <a
                href="#"
                class="social"
                title="Facebook"
                aria-label="Facebook"
            >

                <svg viewBox="0 0 24 24">

                    <path d="
                        M14 8h3V4h-3
                        c-3.3 0-5 1.9-5 5v3H6v4h3v8h4v-8h3.5
                        l.5-4H13V9c0-.7.3-1 1-1z
                    "></path>

                </svg>

            </a>


            <!-- TELEGRAM -->

            <a
                href="#"
                class="social"
                title="Telegram"
                aria-label="Telegram"
            >

                <svg viewBox="0 0 24 24">

                    <path d="
                        M21.7 3.2L2.9 10.5
                        c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5
                        1.8 5.6c.2.6.7.8 1.1.3l2.3-2.2
                        4.8 3.5c.9.5 1.6.2 1.8-.8l3.1-14.7
                        c.3-1.2-.5-1.8-1.3-1.5z
                    "></path>

                </svg>

            </a>


            <!-- X / TWITTER -->

            <a
                href="#"
                class="social"
                title="X / Twitter"
                aria-label="X / Twitter"
            >

                <svg viewBox="0 0 24 24">

                    <path d="
                        M18.9 2H22l-6.8 7.8L23 22h-6.1
                        l-4.8-6.3L6.6 22H3.5l7.3-8.4L3 2h6.2
                        l4.3 5.7L18.9 2zm-1.1 17.8h1.7L8.3 4.1H6.5z
                    "></path>

                </svg>

            </a>


            <!-- GOOGLE -->

            <a
                href="#"
                class="social"
                title="Google"
                aria-label="Google"
            >

                <svg viewBox="0 0 24 24">

                    <path d="
                        M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8
                        h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2
                        c1.9-1.8 3.1-4.4 3.1-7.5z

                        M12 22c2.7 0 5-.9 6.7-2.4
                        l-3.2-2.6c-.9.6-2.1 1-3.5 1
                        -2.7 0-5-1.8-5.8-4.2H2.9v2.7
                        A10.1 10.1 0 0 0 12 22z

                        M6.2 13.8A6.1 6.1 0 0 1 5.9 12
                        c0-.6.1-1.2.3-1.8V7.5H2.9
                        A10 10 0 0 0 2 12
                        c0 1.6.4 3.1.9 4.5z

                        M12 6c1.5 0 2.8.5 3.8 1.5
                        l2.9-2.9C17 2.9 14.7 2 12 2
                        A10.1 10.1 0 0 0 2.9 7.5
                        l3.3 2.7C7 7.8 9.3 6 12 6z
                    "></path>

                </svg>

            </a>


        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">

            MYSHORT

        </div>


    </main>


</div>


</body>

</html>
