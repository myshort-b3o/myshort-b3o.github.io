<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#101d3d"
>

<title>MyShort</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   BODY
===================================================== */

html,
body{

    width:100%;
    height:100%;

}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#dce7ff;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 18%,
            #233967 0%,
            #192b55 30%,
            #142447 58%,
            #101d3d 100%
        );

}


/* =====================================================
   BACKGROUND PREMIUM EFFECT
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    top:-180px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(88,126,205,.20),
            rgba(40,69,125,.08) 45%,
            transparent 70%
        );

    pointer-events:none;

}


body::after{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    left:50%;
    bottom:-380px;

    transform:translateX(-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(56,91,161,.16),
            transparent 68%
        );

    pointer-events:none;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;
    height:100vh;

    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

}


/* =====================================================
   LOGIN SCREEN
===================================================== */

.login-screen{

    width:100%;
    max-width:430px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    position:relative;

    z-index:2;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:205px;
    height:205px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:15px;

}


/*
   LOGO ASLI
   WARNA TIDAK DIUBAH
*/

.logo img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

}


/* =====================================================
   NAMA MYSHORT
===================================================== */

.brand-name{

    font-size:39px;

    font-weight:400;

    letter-spacing:-1px;

    color:#dce7ff;

    margin-bottom:36px;

    text-transform:lowercase;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button{

    width:285px;
    max-width:100%;

    height:56px;

    border-radius:17px;

    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-size:16px;

    font-weight:700;

    letter-spacing:.3px;

    color:#eaf1ff;

    background:

        linear-gradient(
            145deg,
            #304a82,
            #263d70
        );

    border:

        1px solid
        rgba(128,160,224,.28);

    box-shadow:

        0 10px 28px
        rgba(0,0,0,.25),

        inset
        0 1px 0
        rgba(255,255,255,.08);

    transition:

        transform .18s ease,
        background .18s ease;

}


.login-button:active{

    transform:scale(.96);

}


.login-button:hover{

    background:

        linear-gradient(
            145deg,
            #38558f,
            #2b4378
        );

}


/* =====================================================
   LOGIN ICON
===================================================== */

.login-icon{

    width:22px;
    height:22px;

    margin-right:9px;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =====================================================
   SOCIAL
===================================================== */

.social-area{

    margin-top:24px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

}


/* =====================================================
   SOCIAL CIRCLE
===================================================== */

.social{

    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#91b1ff;

    background:

        linear-gradient(
            145deg,
            #263d73,
            #1d315e
        );

    border:

        1px solid
        rgba(111,145,215,.22);

    box-shadow:

        0 6px 16px
        rgba(0,0,0,.22),

        inset
        0 1px 0
        rgba(255,255,255,.05);

    transition:

        transform .18s ease,
        background .18s ease;

}


.social:active{

    transform:scale(.90);

}


.social:hover{

    transform:translateY(-2px);

    background:#2d467e;

}


/* =====================================================
   SOCIAL SVG
===================================================== */

.social svg{

    width:18px;
    height:18px;

    display:block;

    fill:currentColor;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:25px;

    font-size:9px;

    letter-spacing:2px;

    color:#657da9;

    opacity:.75;

}


/* =====================================================
   HP KECIL
===================================================== */

@media(max-width:390px){

    .logo{

        width:175px;
        height:175px;

    }


    .brand-name{

        font-size:35px;

        margin-bottom:30px;

    }


    .login-button{

        width:270px;

        height:53px;

    }


    .social{

        width:37px;
        height:37px;

    }


    .social-area{

        gap:11px;

    }

}


/* =====================================================
   HP PENDEK
===================================================== */

@media(max-height:680px){

    .logo{

        width:150px;
        height:150px;

        margin-bottom:10px;

    }


    .brand-name{

        font-size:32px;

        margin-bottom:22px;

    }


    .login-button{

        height:50px;

    }


    .social-area{

        margin-top:18px;

    }


    .footer{

        margin-top:17px;

    }

}


/* =====================================================
   HP SANGAT PENDEK
===================================================== */

@media(max-height:580px){

    .logo{

        width:125px;
        height:125px;

    }


    .brand-name{

        font-size:29px;

        margin-bottom:17px;

    }


    .login-button{

        height:47px;

    }


    .social{

        width:34px;
        height:34px;

    }


    .social svg{

        width:16px;
        height:16px;

    }

}

</style>

</head>


<body>


<div class="container">


    <main class="login-screen">


        <!-- =========================================
             LOGO MYSHORT
        ========================================== -->

        <div class="logo">

            <img
                src="logo.png"
                alt="MyShort"
            >

        </div>


        <!-- =========================================
             NAMA
        ========================================== -->

        <div class="brand-name">

            myshort

        </div>


        <!-- =========================================
             LOGIN
        ========================================== -->

        <a
            href="login.html"
            class="login-button"
        >

            <span class="login-icon">

                <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="16"
                        rx="3"
                    />

                    <path
                        d="M8 12h8"
                    />

                    <path
                        d="M13 9l3 3-3 3"
                    />

                </svg>

            </span>

            LOGIN / MASUK

        </a>


        <!-- =========================================
             SOCIAL ICON
        ========================================== -->

        <div class="social-area">


            <!-- FACEBOOK -->

            <a
                href="#"
                class="social"
                title="Facebook"
                aria-label="Facebook"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="
                        M14 8h3V4h-3
                        c-3.3 0-5 1.9-5 5v3H6v4h3v8h4v-8h3.5
                        l.5-4H13V9c0-.7.3-1 1-1z
                    "/>

                </svg>

            </a>


            <!-- TELEGRAM -->

            <a
                href="#"
                class="social"
                title="Telegram"
                aria-label="Telegram"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="
                        M21.7 3.2L2.9 10.5
                        c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5
                        1.8 5.6c.2.6.7.8 1.1.3l2.3-2.2
                        4.8 3.5c.9.5 1.6.2 1.8-.8l3.1-14.7
                        c.3-1.2-.5-1.8-1.3-1.5z
                    "/>

                </svg>

            </a>


            <!-- TWITTER / X -->

            <a
                href="#"
                class="social"
                title="Twitter X"
                aria-label="Twitter X"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="
                        M18.9 2H22l-6.8 7.8L23 22h-6.1
                        l-4.8-6.3L6.6 22H3.5l7.3-8.4L3 2h6.2
                        l4.3 5.7L18.9 2zm-1.1 17.8h1.7L8.3 4.1H6.5z
                    "/>

                </svg>

            </a>


            <!-- GOOGLE -->

            <a
                href="#"
                class="social"
                title="Google"
                aria-label="Google"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="
                        M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8
                        h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2
                        c1.9-1.8 3.1-4.4 3.1-7.5z

                        M12 22c2.7 0 5-.9 6.7-2.4
                        l-3.2-2.6c-.9.6-2.1 1-3.5 1
                        -2.7 0-5-1.8-5.8-4.2H2.9v2.7
                        A10.1 10.1 0 0 0 12 22z

                        M6.2 13.8A6.1 6.1 0 0 1 5.9 12
                        c0-.6.1-1.2.3-1.8V7.5H2.9
                        A10 10 0 0 0 2 12
                        c0 1.6.4 3.1.9 4.5z

                        M12 6c1.5 0 2.8.5 3.8 1.5
                        l2.9-2.9C17 2.9 14.7 2 12 2
                        A10.1 10.1 0 0 0 2.9 7.5
                        l3.3 2.7C7 7.8 9.3 6 12 6z
                    "/>

                </svg>

            </a>


        </div>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <div class="footer">

            MYSHORT

        </div>


    </main>


</div>


</body>

</html>
