<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#081a42">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MyShort</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#f2f6ff;
    overflow:hidden;
    background:#081a42;
}

/* Latar polos seperti desain yang diminta */
.page{
    width:100%;
    height:100vh;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-screen{
    width:100%;
    max-width:390px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

/* Logo dengan bingkai putih */
.logo-frame{
    width:148px;
    height:148px;
    padding:7px;
    border:3px solid rgba(255,255,255,.98);
    border-radius:28px;
    background:#050b1b;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 8px 28px rgba(0,0,0,.30);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
}

.logo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:20px;
}

/* Nama brand */
.brand-name{
    font-size:42px;
    line-height:1;
    font-weight:400;
    letter-spacing:-1.8px;
    margin-bottom:13px;
    color:#f7f9ff;
}

.brand-name .short{
    color:#55bff2;
}

/* Tagline */
.tagline{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:38px;
    color:#9db1d8;
    font-size:11px;
    font-weight:500;
    letter-spacing:4px;
    white-space:nowrap;
}

.tagline::before,
.tagline::after{
    content:"";
    width:58px;
    height:1px;
    background:#2f67c4;
    opacity:.9;
}

/* Tombol login lebih kecil dan rapi */
.login-button{
    width:min(270px,78vw);
    height:54px;
    padding:0 16px;
    border:1.5px solid #2f9ff0;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    text-decoration:none;
    color:#f6f9ff;
    background:#16377a;
    box-shadow:
        0 7px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.10);
    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
    transition:transform .18s ease, background .18s ease;
}

.login-button:active{
    transform:scale(.965);
}

.login-button:hover{
    background:#1b438d;
}

.login-icon{
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 24px;
}

.login-icon svg{
    width:24px;
    height:24px;
}

.login-divider{
    width:1px;
    height:24px;
    background:rgba(255,255,255,.32);
}

.login-arrow{
    margin-left:auto;
    font-size:28px;
    line-height:1;
    font-weight:300;
}

/* Social */
.social-area{
    margin-top:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:19px;
}

.social{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#eef5ff;
    background:#102d68;
    border:2px solid #2b62bd;
    box-shadow:0 5px 15px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .18s ease, background .18s ease;
}

.social:active{
    transform:scale(.91);
}

.social:hover{
    background:#173b82;
}

.social svg{
    width:22px;
    height:22px;
    display:block;
    fill:currentColor;
}

.footer{
    margin-top:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    color:#6078a8;
    font-size:10px;
    letter-spacing:4px;
}

.footer::before,
.footer::after{
    content:"";
    width:62px;
    height:1px;
    background:#2f67c4;
}

/* HP kecil */
@media(max-width:390px){
    .page{padding:16px;}

    .logo-frame{
        width:132px;
        height:132px;
        border-radius:25px;
        padding:6px;
        margin-bottom:16px;
    }

    .logo-frame img{border-radius:18px;}

    .brand-name{
        font-size:38px;
        margin-bottom:11px;
    }

    .tagline{
        font-size:9px;
        letter-spacing:3px;
        gap:9px;
        margin-bottom:32px;
    }

    .tagline::before,
    .tagline::after{
        width:43px;
    }

    .login-button{
        width:min(286px,82vw);
        height:55px;
        font-size:15px;
        gap:11px;
    }

    .social-area{
        margin-top:27px;
        gap:15px;
    }

    .social{
        width:47px;
        height:47px;
    }

    .footer{
        margin-top:43px;
        font-size:9px;
        gap:18px;
    }

    .footer::before,
    .footer::after{
        width:48px;
    }
}

/* HP pendek */
@media(max-height:700px){
    .logo-frame{
        width:112px;
        height:112px;
        border-radius:22px;
        margin-bottom:13px;
    }

    .logo-frame img{border-radius:16px;}

    .brand-name{
        font-size:34px;
        margin-bottom:9px;
    }

    .tagline{
        margin-bottom:25px;
    }

    .login-button{
        height:52px;
    }

    .social-area{
        margin-top:23px;
    }

    .social{
        width:44px;
        height:44px;
    }

    .footer{
        margin-top:31px;
    }
}

@media(max-height:600px){
    .logo-frame{
        width:92px;
        height:92px;
        border-width:2px;
        border-radius:19px;
    }

    .brand-name{font-size:30px;}

    .tagline{
        font-size:8px;
        margin-bottom:20px;
    }

    .login-button{
        height:48px;
        font-size:14px;
    }

    .social-area{
        margin-top:18px;
    }

    .social{
        width:39px;
        height:39px;
    }

    .social svg{width:18px;height:18px;}

    .footer{margin-top:22px;}
}
</style>
</head>

<body>
<div class="page">
    <main class="login-screen">

        <div class="logo-frame">
            <img src="logo.png" alt="MyShort">
        </div>

        <div class="brand-name">
            my<span class="short">short</span>
        </div>

        <div class="tagline">
            XMR MINING CENTER
        </div>

        <a href="login.html" class="login-button" aria-label="Login atau Masuk">
            <span class="login-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                    <path d="M8 12h8"></path>
                    <path d="m13 9 3 3-3 3"></path>
                </svg>
            </span>
            <span class="login-divider"></span>
            <span>LOGIN / MASUK</span>
            <span class="login-arrow">›</span>
        </a>

        <div class="social-area">
            <a href="#" class="social" aria-label="Facebook" title="Facebook">
                <svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-3.3 0-5 1.9-5 5v3H6v4h3v8h4v-8h3.5l.5-4H13V9c0-.7.3-1 1-1z"/></svg>
            </a>

            <a href="#" class="social" aria-label="Telegram" title="Telegram">
                <svg viewBox="0 0 24 24"><path d="M21.7 3.2 2.9 10.5c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.7.8 1.1.3l2.3-2.2 4.8 3.5c.9.5 1.6.2 1.8-.8l3.1-14.7c.3-1.2-.5-1.8-1.3-1.5z"/></svg>
            </a>

            <a href="#" class="social" aria-label="X" title="X">
                <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.1l-4.8-6.3L6.6 22H3.5l7.3-8.4L3 2h6.2l4.3 5.7L18.9 2zm-1.1 17.8h1.7L8.3 4.1H6.5z"/></svg>
            </a>

            <a href="#" class="social" aria-label="Google" title="Google">
                <svg viewBox="0 0 24 24"><path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2c1.9-1.8 3.1-4.4 3.1-7.5zM12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.2H2.9v2.7A10.1 10.1 0 0 0 12 22zM6.2 13.8A6.1 6.1 0 0 1 5.9 12c0-.6.1-1.2.3-1.8V7.5H2.9A10 10 0 0 0 2 12c0 1.6.4 3.1.9 4.5zM12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2A10.1 10.1 0 0 0 2.9 7.5l3.3 2.7C7 7.8 9.3 6 12 6z"/></svg>
            </a>
        </div>

        <div class="footer">MYSHORT</div>
    </main>
</div>
</body>
</html>
