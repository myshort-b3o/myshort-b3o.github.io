<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#07090b"><title>Password Baru - MyShort Platform</title><link rel="stylesheet" href="premium-brand.css"><style>:root{--gold:#f3c95f;--gold2:#ffe7a0;--muted:#92959e}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;color:#f7f7f7;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 12% 5%,rgba(243,201,95,.14),transparent 28%),radial-gradient(circle at 90% 90%,rgba(243,201,95,.08),transparent 30%),linear-gradient(145deg,#07090b,#15171b 52%,#07090b)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);background-size:27px 27px}.wrap{width:100%;max-width:430px;position:relative;z-index:1}.card{background:linear-gradient(145deg,rgba(25,27,30,.98),rgba(10,12,15,.99));border:1px solid rgba(243,201,95,.28);border-radius:25px;padding:25px 20px;box-shadow:0 24px 65px rgba(0,0,0,.48)}h1{font-size:23px;color:var(--gold2);margin:0 0 8px;text-align:center}p{color:var(--muted);font-size:12px;line-height:1.6;text-align:center;margin:0 0 20px}label{display:block;color:#c8c9cd;font-size:12px;font-weight:650;margin-bottom:7px}input{width:100%;height:48px;border:1px solid rgba(243,201,95,.2);border-radius:12px;background:#0b0d10;color:#fff;padding:0 13px;font-size:13px;outline:none}input:focus{border-color:rgba(243,201,95,.75);box-shadow:0 0 0 3px rgba(243,201,95,.07)}button{width:100%;margin-top:14px;padding:13px;border-radius:13px;border:1px solid rgba(255,231,160,.7);background:linear-gradient(135deg,#ffe8a6,#d8a83a);color:#18140b;font-weight:850;cursor:pointer}.msg{display:none;margin-top:13px;padding:11px;border-radius:12px;font-size:11px;line-height:1.5;text-align:center}.ok{color:#9df0bc;background:rgba(66,199,122,.08);border:1px solid rgba(66,199,122,.25)}.err{color:#ffb7ae;background:rgba(210,70,60,.08);border:1px solid rgba(210,70,60,.25)}.back{display:block;text-align:center;margin-top:16px;color:var(--gold2);font-size:11px;text-decoration:none}</style></head><body><main class="wrap"><div class="card"><div class="sp-brand"><img class="sp-logo" src="logo.png" alt="MyShort Logo"><div class="sp-brand-text"><strong>MyShort Platform</strong><small>Member Area</small></div></div><h1>Buat Password Baru</h1><p>Masukkan password baru untuk akun Anda. Gunakan minimal 6 karakter.</p><form id="resetForm"><label for="password">Password baru</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" required><label for="password2" style="margin-top:13px">Ulangi password</label><input id="password2" type="password" minlength="6" autocomplete="new-password" placeholder="Ulangi password" required><button type="submit">Simpan Password</button></form><div id="ok" class="msg ok"></div><div id="err" class="msg err"></div><a class="back" href="index.html">← Kembali ke Login</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script src="pages.js"></script></body></html>
